name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck / lint / test / build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Worker typecheck
        run: pnpm worker:typecheck

      - name: Circular dependency check
        run: pnpm circular

  docker:
    name: Docker image builds, starts and answers /healthz
    runs-on: ubuntu-latest
    needs: ci
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t "price-tracker:$GITHUB_RUN_ID" .

      - name: Run the container
        env:
          IMAGE: 'price-tracker:$GITHUB_RUN_ID'
        run: |
          docker run -d --name price-tracker-smoke --network host \
            -e NODE_ENV=production \
            -e PORT=3000 \
            -e BOT_TOKEN=dummy-token \
            -e API_KEY=ci-test-key \
            -e DB_URL=mongodb://127.0.0.1:27017 \
            "$IMAGE"

      - name: Wait for /healthz
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz; then
              exit 0
            fi
            sleep 2
          done
          echo "price-tracker did not become healthy" >&2
          docker logs price-tracker-smoke >&2 || true
          exit 1
