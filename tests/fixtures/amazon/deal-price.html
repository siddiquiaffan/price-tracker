<!doctype html>
<html lang="en">
  <head>
    <title>Amazon.in: Deal Product</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Example Smartphone 128GB",
        "image": "https://m.media-amazon.com/images/I/example-phone.jpg",
        "offers": {
          "@type": "Offer",
          "price": "45999.00",
          "priceCurrency": "INR",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
  </head>
  <body>
    <h1 id="productTitle">Example Smartphone 128GB</h1>
    <div id="corePriceDisplay_desktop_feature_div">
      <span class="a-price"><span class="a-offscreen">₹45,999.00</span></span>
    </div>
  </body>
</html>
