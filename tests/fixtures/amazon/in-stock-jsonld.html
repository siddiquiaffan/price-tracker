<!doctype html>
<html lang="en">
  <head>
    <title>Amazon.in: Example Product</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Example Wireless Headphones, Black",
        "image": ["https://m.media-amazon.com/images/I/example-headphones.jpg"],
        "offers": {
          "@type": "Offer",
          "price": "129999.00",
          "priceCurrency": "INR",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
  </head>
  <body>
    <h1 id="productTitle">Example Wireless Headphones, Black</h1>
  </body>
</html>
