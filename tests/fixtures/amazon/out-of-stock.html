<!doctype html>
<html lang="en">
  <head>
    <title>Amazon.in: Out of Stock</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Example Sold Out Item",
        "offers": {
          "@type": "Offer",
          "priceCurrency": "INR",
          "availability": "https://schema.org/OutOfStock"
        }
      }
    </script>
  </head>
  <body>
    <h1 id="productTitle">Example Sold Out Item</h1>
    <div id="availability"><span>Currently unavailable.</span></div>
  </body>
</html>
